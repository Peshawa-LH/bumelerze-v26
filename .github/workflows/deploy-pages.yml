# Deploys the WEBSITE to GitHub Pages on every push to main.
#
# Hosting layout (since 2026-10):
#   https://bumelerze.com/          -> website (this workflow, GitHub Pages;
#                                      Cloudflare DNS -> Pages custom domain)
#   https://app.bumelerze.com/      -> the app (Cloudflare Pages project
#                                      `bumelerze-app`, builds main with
#                                      `bash scripts/build-app-web.sh`)
#
# bumelerze.com no longer hosts the app. It only forwards, in the browser:
#   /app, /app/<path>   -> the same path on app.bumelerze.com (query + hash kept)
#   /e/<id>, /u/<name>, /join?…  -> the app's event, profile and join pages
# Both forwarding pages (website/app/index.html and website/404.html, which
# Pages serves for any path that is not a file) are generated with the rest
# of the site by scripts/build-website.mjs from website-src/redirects.js.
#
# The website is committed pre-built (website/, checked by the jest website
# tests), so this job has no build step and needs no Node: it publishes
# website/ as-is. Asset URLs already carry content hashes from the build.
#
# Public repo => Actions minutes and Pages hosting are free without limits
# that matter at our scale. netlify.toml is a dormant mirror (2026-08-16).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the website (no app build; /app only forwards)
        run: |
          mkdir pages-dist
          cp -r website/. pages-dist/
          rm -f pages-dist/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
