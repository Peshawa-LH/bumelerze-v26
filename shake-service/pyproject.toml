[project]
name = "bumelerze-shake-service"
version = "0.1.0"
description = "Regional ShakeMap engine for Bumelerze (Kurdistan earthquake app) — hazardlib GMPE adapter + gmpe_forward/mvn engine (extracted from SHAKEmaps-Toolkit-v26)."
requires-python = ">=3.11"
readme = "README.md"

# Exact pins on the directly-requested packages (D20 §6.3: pin exact
# version, revalidate on upgrade). h5py was previously only a transitive
# dependency (pulled in by openquake.engine); wave B's vs30.RasterVs30
# imports it directly (module docstring: reads the toolkit's backbone Vs30
# grid, a NetCDF4-classic/HDF5 container, with no new heavy dependency),
# so it is now pinned explicitly too. Full transitive closure is recorded
# in requirements.txt for reproducible installs; this section documents
# intent.
dependencies = [
    "openquake.engine==3.26.2",
    "ps2ff==1.5.9",
    "h5py==3.16.0",
    "scikit-image==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: network-dependent / long-running (e.g. the Halabja D20 smoke test); excluded from the default run via `-m 'not slow'` in CI-equivalent fast passes, run explicitly otherwise.",
]
