<a class="skip-link" href="#main">{{ui.skip}}</a>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand-link" href="index.html">
      <picture>
        <source srcset="{{@root}}brand/bumelerze-primary-horizontal-reversed.svg" media="(prefers-color-scheme: dark)">
        <img class="brand-logo" src="{{@root}}brand/bumelerze-primary-horizontal.svg" alt="{{=brand}}" width="176" height="32">
      </picture>
    </a>
    <div class="header-nav-group">
      <!-- Wide screens: the full row. Narrower: the same links behind a
           menu button. CSS shows exactly one of the two. -->
      <nav class="site-nav site-nav--row" aria-label="{{=nav.aria}}">
        {{>navLinks}}
      </nav>
      <details class="nav-menu">
        <summary title="{{=ui.menu}}"><svg class="nav-burger" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="nav-menu-label">{{ui.menu}}</span></summary>
        <nav class="nav-panel" aria-label="{{=nav.aria}}">
          {{>navLinks}}
        </nav>
      </details>
      <details class="lang-menu">
        <summary lang="{{@lang}}" title="{{=ui.language}}"><svg class="lang-globe" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg><span class="visually-hidden">{{ui.language}}: </span><span class="lang-name">{{@langName}}</span></summary>
        <nav class="lang-switcher-inline" aria-label="{{=ui.language}}">
          {{>langLinks}}
        </nav>
      </details>
    </div>
  </div>
</header>
