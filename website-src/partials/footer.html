<div class="skyline-band" aria-hidden="true">{{>skyline}}</div>
<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="footer-col footer-brand">
      <img class="brand-logo" src="{{@root}}brand/bumelerze-primary-horizontal-reversed.svg" alt="{{=brand}}" width="176" height="32" loading="lazy">
      <p class="footer-tagline">{{footer.tagline}}</p>
    </div>
    <div class="footer-col">
      <h2>{{footer.site}}</h2>
      <ul>
        <li><a href="./">{{nav.home}}</a></li>
        <li><a href="how-it-works">{{nav.how_it_works}}</a></li>
        <li><a href="handbook">{{nav.handbook}}</a></li>
        <li><a href="about">{{nav.about}}</a></li>
        <li><a href="support">{{nav.support}}</a></li>
        <li><a href="privacy">{{footer.privacy}}</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h2>{{footer.contact}}</h2>
      <ul>
        <li><a href="mailto:hello@bumelerze.com"><bdi>hello@bumelerze.com</bdi></a></li>
      </ul>
      {{>social footer}}
    </div>
    <div class="footer-legal">
      <span>{{footer.legal}}</span>
    </div>
  </div>
</footer>
