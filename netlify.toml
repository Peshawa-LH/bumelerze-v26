# Netlify deploy configuration.
#
# One site, two things served:
#   /      -> the static marketing/privacy site (website/ folder, no build)
#   /app/  -> the Expo web export of the actual app (built on Netlify),
#             usable from any phone browser — interim phone testing until
#             the Expo dev build exists.
#
# This file takes precedence over dashboard build settings, so the
# connected-repo deploy works without manual Netlify configuration.

[build]
  command = "npm ci --no-audit --no-fund && npx expo export --platform web --output-dir netlify-dist/app && cp -r website/. netlify-dist/"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "22"
  # Makes app.config.ts export the app as a SPA rooted at /app (see the
  # webBaseUrl comment there).
  BUMELERZE_WEB_BASE_URL = "/app"
  # Same two values as the local .env (supabase/README.md "Wiring status") —
  # without these the Netlify web build falls back to PendingTransport
  # (local-only queue, no sync) same as an unconfigured dev environment.
  # `EXPO_PUBLIC_`-prefixed vars are inlined into the JS bundle at build time
  # and ship inside every client anyway (see .env.example's own comment), so
  # committing them here is not a secret leak: EXPO_PUBLIC_SUPABASE_ANON_KEY
  # is Supabase's publishable/anon key, explicitly designed to be public
  # (every RLS policy in supabase/migrations/ is written assuming the anon
  # key is not a secret) — the service_role key, which actually must stay
  # secret, is never used client-side and never belongs in an EXPO_PUBLIC_ var.
  EXPO_PUBLIC_SUPABASE_URL = "https://bcgyxepgruwardhozvfq.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_j1XFI8mQbqOOyIsNftgM9g_3BtcPJ9I"

# SPA fallback: any in-app route (e.g. /app/event/abc123) serves the app
# shell; Expo Router takes over client-side.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Long cache for the website stylesheet, standard revalidation for pages.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# SPA cache hygiene (order matters — Netlify applies the LAST matching rule
# per header): app HTML (including every SPA-fallback response for
# /app/<route>) must NEVER be reused without revalidation, or a browser
# that cached a pre-deploy page keeps requesting that build's chunk files,
# which stop existing after the next deploy (the fallback then masks the
# 404 as HTML → "non-JavaScript MIME type" module errors → broken app
# until the cache expires). The content-hashed _expo assets, by contrast,
# are immutable by construction and safe to cache for a year.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# maplibre-gl's web worker (synced from node_modules into public/ by
# scripts/sync-maplibre-worker.js — see MAP_WORKER_URL's doc comment in
# src/features/map/config.ts for the full story) is loaded via a real
# `new Worker(url, { type: "module" })`, which browsers refuse to run
# unless the response's Content-Type is a JS MIME type — pinned explicitly
# rather than trusted to whatever Netlify's default mime table happens to
# do with a ".mjs" extension, since a wrong Content-Type here would 404 (as
# far as the browser's module loader is concerned) in exactly the same
# silent, hard-to-notice way the original missing-file bug did. Not
# content-hashed (unlike _expo/*), so it stays under the /app/* "no-cache"
# revalidation rule above rather than the immutable one — a stale cached
# copy after a maplibre-gl version bump would break the map the same way a
# stale cached app shell would.
[[headers]]
  for = "/app/maplibre-gl-worker.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/app/maplibre-gl-shared.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
